<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>QuantumWear — Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Instrument+Sans:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --bg:        #0a0a0b;
  --surface:   #111113;
  --surface2:  #18181c;
  --border:    rgba(255,255,255,0.07);
  --border2:   rgba(255,255,255,0.13);
  --text:      #f0ede8;
  --muted:     #6b6875;
  --muted2:    #9996a3;
  --accent:    #e8c547;
  --accent2:   #5b8cf5;
  --positive:  #4ade9a;
  --negative:  #f76c6c;
  --radius:    12px;
  --radius-lg: 20px;
}

html { font-size: 16px; scroll-behavior: smooth; }

body {
  font-family: 'Instrument Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none;
  z-index: 0;
}

.orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(120px);
  pointer-events: none;
  z-index: 0;
  opacity: 0.18;
}
.orb-1 { width: 600px; height: 600px; background: #5b8cf5; top: -200px; right: -150px; }
.orb-2 { width: 400px; height: 400px; background: #e8c547; bottom: -100px; left: -100px; }

header {
  position: sticky;
  top: 0;
  z-index: 10;
  padding: 1.25rem 2.5rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  backdrop-filter: blur(12px);
  background: rgba(10,10,11,0.7);
}
.brand { display: flex; align-items: center; gap: 0.75rem; }
.brand-icon {
  width: 34px; height: 34px;
  background: var(--accent);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: #0a0a0b;
}
.brand-name {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 1.1rem;
  letter-spacing: -0.01em;
}
.brand-name span { color: var(--accent); }
.header-badge {
  font-size: 0.7rem;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted2);
  background: var(--surface2);
  border: 1px solid var(--border2);
  padding: 0.3rem 0.8rem;
  border-radius: 100px;
}

main {
  position: relative;
  z-index: 1;
  max-width: 1100px;
  margin: 0 auto;
  padding: 3rem 2rem 5rem;
}

.page-title { margin-bottom: 2.5rem; }
.page-title h1 {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: clamp(2rem, 5vw, 3rem);
  letter-spacing: -0.03em;
  line-height: 1.05;
  margin-bottom: 0.5rem;
}
.page-title h1 em {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  color: var(--accent);
}
.page-title p { color: var(--muted2); font-size: 0.9rem; font-weight: 300; }

/* Product Grid */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 1.5rem;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--radius-lg);
  overflow: hidden;
  transition: transform 0.2s, border-color 0.2s;
  position: relative;
}
.card::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border2), transparent);
}
.card:hover {
  transform: translateY(-4px);
  border-color: rgba(232,197,71,0.3);
}

.card-img {
  width: 100%;
  height: 260px;
  object-fit: cover;
  background: var(--surface2);
  display: block;
}

.card-body { padding: 1.5rem; }

.card-brand {
  font-size: 0.68rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 0.4rem;
}

.card-name {
  font-family: 'Syne', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: -0.01em;
  margin-bottom: 0.75rem;
  line-height: 1.3;
}

.card-price {
  font-family: 'Syne', sans-serif;
  font-size: 1.4rem;
  font-weight: 800;
  color: var(--accent);
  letter-spacing: -0.02em;
  margin-bottom: 1.25rem;
}

.card-btn {
  display: block;
  text-align: center;
  background: var(--accent);
  color: #0a0a0b;
  padding: 0.75rem;
  border-radius: var(--radius);
  text-decoration: none;
  font-family: 'Syne', sans-serif;
  font-size: 0.85rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  transition: background 0.2s, transform 0.15s;
}
.card-btn:hover { background: #f5d454; transform: translateY(-1px); }

@media (max-width: 600px) {
  main { padding: 2rem 1rem 4rem; }
  header { padding: 1rem 1.25rem; }
}
</style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<header>
  <div class="brand">
    <div class="brand-icon">✦</div>
    <div class="brand-name">Quantum<span>Wear</span></div>
  </div>
  <div class="header-badge">Premium Clothing Store</div>
</header>

<main>
  <div class="page-title">
    <h1>New <em>Arrivals</em></h1>
    <p>Handpicked styles for the season — free shipping on orders over $75</p>
  </div>

  <div class="grid">
    {% for product in products %}
    <div class="card">
      <img src="{{ product.image }}" alt="{{ product.name }}" class="card-img"
           onerror="this.style.background='#18181c'">
      <div class="card-body">
        <div class="card-brand">{{ product.brand }}</div>
        <div class="card-name">{{ product.name }}</div>
        <div class="card-price">{{ product.price }}</div>
        <a href="/product/{{ product.id }}" class="card-btn">View Product →</a>
      </div>
    </div>
    {% endfor %}
  </div>
</main>

</body>
</html>
